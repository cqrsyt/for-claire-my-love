<!DOCTYPE html>
<html lang="zh-Hans" data-lang="zh" data-screen="cover">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fdfaf5" />
    <title>For Claire My Love · 写给秋然</title>
    <link rel="preload" href="fonts/mashanzheng.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/cormorant-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/app.css?v=35" />
    <link rel="stylesheet" href="css/unify.css?v=35" />
  </head>
  <body class="locked">
    <div class="paper-grain" aria-hidden="true"></div>
    <div class="garden" aria-hidden="true">
      <span class="vine vine-l"></span>
      <span class="vine vine-r"></span>
      <span class="petal p1">✿</span>
      <span class="petal p2">✿</span>
      <span class="petal p3">✿</span>
      <span class="petal p4">🌸</span>
      <span class="petal p5">✦</span>
      <span class="petal p6">✿</span>
      <span class="petal p7">✿</span>
      <span class="petal p8">🌸</span>
      <span class="sprig s1">🌿</span>
      <span class="sprig s2">🌿</span>
    </div>
    <div class="star-field" id="star-field" aria-hidden="true"></div>
    <div id="leaves" aria-hidden="true"></div>
    <div id="motif-bits" aria-hidden="true"></div>
    <div class="bloom-field" aria-hidden="true">
      <span class="bloom bloom-a"></span>
      <span class="bloom bloom-b"></span>
      <span class="bloom bloom-c"></span>
    </div>
    <div class="lace lace-top" aria-hidden="true"></div>
    <div class="lace lace-bottom" aria-hidden="true"></div>
    <div class="edge-pattern edge-left" aria-hidden="true">🍅 🫑 🍆 🐕 🍁 🌸</div>
    <div class="edge-pattern edge-right" aria-hidden="true">🌸 🍁 🐕 🍆 🫑 🍅</div>
    <div id="bday-wish" class="bday-wish" hidden aria-hidden="true">
      <span class="bday-heart">♥</span>
      <span class="bday-text zh">祝大宝生日快乐</span>
    </div>
    <div id="wish-toast" class="wish-toast" hidden aria-hidden="true">
      <span class="wish-text zh">大宝，我在。</span>
    </div>
    <div id="password-gate" class="gate">
      <div class="gate-card">
        <p class="kicker zh">写给秋然</p>
        <h1 class="zh">请输入密码</h1>
        <p class="sub en">For Claire My Love</p>
        <form id="password-form" action="javascript:void(0)" method="post" onsubmit="return false;">
          <input type="password" id="password-input" placeholder="密码 / password" required autocomplete="off" />
          <button type="submit" class="btn zh">进入</button>
        </form>
        <p id="password-error" class="error zh" hidden>密码不对，再试一次</p>
      </div>
    </div>
    <div id="app" hidden>
      <header class="top">
        <div>
          <div id="brand-title" class="brand-title zh">写给秋然</div>
          <div id="brand-sub" class="brand-sub zh">秋日</div>
        </div>
        <div class="top-actions">
          <nav id="nav" class="nav">
            <button type="button" data-view="cover" class="active">封面</button>
            <button type="button" data-view="story">信</button>
            <button type="button" data-view="album">相册</button>
          </nav>
          <div class="lang"><button type="button" id="btn-lang">EN</button></div>
          <div class="music-ctl">
            <label id="music-vol-wrap" class="music-vol-wrap">
              <input id="music-vol" class="music-vol" type="range" min="0.08" max="0.85" step="0.01" value="0.38" aria-label="音量" />
            </label>
            <button type="button" id="btn-music" class="btn-music is-on" aria-pressed="true" aria-label="暂停音乐" title="暂停音乐">
              <svg class="music-glyph" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M10 18.5V7.2l9-1.7v11.3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
                <circle cx="8.2" cy="18.5" r="2.35" fill="currentColor" />
                <circle cx="17.2" cy="16.8" r="2.35" fill="currentColor" />
                <path class="music-slash" d="M4.2 5.2l15.6 14.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
              </svg>
            </button>
          </div>
        </div>
      </header>
      <div id="motif-row" class="motif-row">
        <label class="motif m1" data-kind="tomato"><input type="radio" name="motif" /><span class="i" aria-hidden="true">🍅</span><span class="spark" aria-hidden="true"></span><span class="say">红着</span></label>
        <label class="motif m2" data-kind="pepper"><input type="radio" name="motif" /><span class="i" aria-hidden="true">🫑</span><span class="spark" aria-hidden="true"></span><span class="say">青着</span></label>
        <label class="motif m3" data-kind="eggplant"><input type="radio" name="motif" /><span class="i" aria-hidden="true">🍆</span><span class="spark" aria-hidden="true"></span><span class="say">静静的</span></label>
        <label class="motif m4" data-kind="dog"><input type="radio" name="motif" /><span class="i" aria-hidden="true">🐕</span><span class="spark" aria-hidden="true"></span><span class="say">小狗</span></label>
        <label class="motif m5" data-kind="maple"><input type="radio" name="motif" /><span class="i" aria-hidden="true">🍁</span><span class="spark" aria-hidden="true"></span><span class="say">秋</span></label>
        <label class="motif m6" data-kind="flower"><input type="radio" name="motif" /><span class="i" aria-hidden="true">🌸</span><span class="spark" aria-hidden="true"></span><span class="say">花开</span></label>
        <label class="motif m7" data-kind="mist"><input type="radio" name="motif" /><span class="i mist" aria-hidden="true"></span><span class="spark" aria-hidden="true"></span><span class="say">淡淡的</span></label>
      </div>
      <p id="motif-hint" class="motif-hint zh">小图案都可以点。</p>
      <section id="view-cover" class="view active" data-view="cover"></section>
      <section id="view-album" class="view" data-view="album">
        <div id="chapter-header" class="chapter"></div>
        <div id="book-stage" class="book-stage">
          <div class="album-book">
            <div class="album-spine" aria-hidden="true"></div>
            <div class="album-stack" aria-hidden="true"></div>
            <div class="album-block">
              <div id="book-page" class="page"></div>
              <div id="book-gl" class="book-gl" aria-hidden="true"></div>
            </div>
          </div>
        </div>
        <p id="swipe-hint" class="hint"></p>
      </section>
      <div class="controls">
        <div id="chapter-strip" class="chapter-strip" role="navigation" aria-label="章节"></div>
        <div class="controls-row">
          <button type="button" id="btn-prev" class="ctrl">上一页</button>
          <select id="page-jump" class="page-jump" aria-label="选页"></select>
          <button type="button" id="btn-next" class="ctrl">下一页</button>
        </div>
      </div>
    </div>
    <div id="lightbox" class="lightbox" hidden>
      <button type="button" id="lightbox-close" class="lightbox-close" aria-label="Close">×</button>
      <button type="button" id="lightbox-prev" class="lightbox-nav is-prev" hidden aria-label="上一张">‹</button>
      <button type="button" id="lightbox-next" class="lightbox-nav is-next" hidden aria-label="下一张">›</button>
      <img id="lightbox-img" alt="" />
      <p id="lightbox-caption"></p>
      <p id="lightbox-note"></p>
    </div>
    <audio id="bgm" src="audio/wind-poem.mp3" loop preload="none"></audio>
    <script src="js/config.js?v=35"></script>
    <script src="js/sha256.js"></script>
    <script>
      (function () {
        var cfg = window.SITE_CONFIG || {};
        var key = cfg.passwordStorageKey || "claire-my-love-unlocked";
        var hash = cfg.sitePasswordHash || "310f089018032ba50b85d43ed54f70c81cf8e8a4846b26bc2037274e56f1acd1";
        var form = document.getElementById("password-form");
        var input = document.getElementById("password-input");
        var err = document.getElementById("password-error");
        function remembered() {
          try { if (sessionStorage.getItem(key) === "1") return true; } catch (e) {}
          try { if (localStorage.getItem(key) === "1") return true; } catch (e) {}
          return false;
        }
        function remember() {
          try { sessionStorage.setItem(key, "1"); } catch (e) {}
          try { localStorage.setItem(key, "1"); } catch (e) {}
        }
        function reveal() {
          remember();
          document.body.classList.remove("locked");
          var gate = document.getElementById("password-gate");
          if (gate) gate.setAttribute("hidden", "");
          var app = document.getElementById("app");
          if (app) {
            app.hidden = false;
            app.classList.add("is-on");
          }
        }
        function digest(val) {
          if (window.ClaireSha256) return Promise.resolve(window.ClaireSha256(val));
          if (window.crypto && crypto.subtle && crypto.subtle.digest) {
            return crypto.subtle.digest("SHA-256", new TextEncoder().encode(val)).then(function (buf) {
              return Array.from(new Uint8Array(buf)).map(function (x) {
                return x.toString(16).padStart(2, "0");
              }).join("");
            });
          }
          return Promise.reject(new Error("no-hash"));
        }
        if (form) {
          form.addEventListener("submit", function (e) {
            e.preventDefault();
            e.stopPropagation();
            digest((input && input.value) || "").then(function (hex) {
              if (hex === hash) reveal();
              else if (err) err.hidden = false;
            }).catch(function () {
              if (err) err.hidden = false;
            });
          });
        }
        if (remembered()) reveal();
      })();
    </script>
    <script src="data/album.js?v=35"></script>
    <script src="js/phone.js?v=35"></script>
    <script src="js/app.js?v=35"></script>
  </body>
</html>
