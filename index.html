<!DOCTYPE html>
<html lang="zh-Hans" data-lang="zh" data-screen="cover">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fdfaf5" />
    <title>For Claire My Love · 写给秋然</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Ma+Shan+Zheng&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css?v=17" />
    <link rel="stylesheet" href="css/book.css?v=17" />
    <link rel="stylesheet" href="css/polish.css?v=17" />
    <link rel="stylesheet" href="css/motion.css?v=17" />
  </head>
  <body class="locked">
    <div class="paper-grain" aria-hidden="true"></div>
    <div class="star-field" id="star-field" aria-hidden="true"></div>
    <div id="leaves" aria-hidden="true"></div>
    <div id="motif-bits" aria-hidden="true"></div>
    <div class="bloom-field" aria-hidden="true">
      <img class="bloom bloom-a" src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=480&q=60" alt="" />
      <img class="bloom bloom-b" src="https://images.unsplash.com/photo-1462275646964-a0e3386b89fa?auto=format&fit=crop&w=480&q=60" alt="" />
      <img class="bloom bloom-c" src="https://images.unsplash.com/photo-1455659817273-f968077465a9?auto=format&fit=crop&w=480&q=60" alt="" />
    </div>
    <div class="lace lace-top" aria-hidden="true"></div>
    <div class="lace lace-bottom" aria-hidden="true"></div>
    <div class="edge-pattern edge-left" aria-hidden="true">🍅 🫑 🍆 🐕 🍁 🌸</div>
    <div class="edge-pattern edge-right" aria-hidden="true">🌸 🍁 🐕 🍆 🫑 🍅</div>
    <div id="bday-wish" class="bday-wish" hidden aria-hidden="true">
      <span class="bday-heart">♥</span>
      <span class="bday-text zh">祝大宝生日快乐</span>
    </div>
    <div id="wish-toast" class="wish-toast" hidden aria-hidden="true">
      <span class="wish-text zh">大宝，我在。</span>
    </div>

    <div id="password-gate" class="gate">
      <div class="gate-card">
        <p class="kicker zh">写给秋然</p>
        <h1 class="zh">请输入密码</h1>
        <p class="sub zh">For Claire My Love</p>
        <form id="password-form">
          <input type="password" id="password-input" placeholder="密码 / password" required autocomplete="off" />
          <button type="submit" class="btn zh">进入</button>
        </form>
        <p id="password-error" class="error" hidden>密码不对，再试一次</p>
      </div>
    </div>

    <div id="app" hidden>
      <header class="top">
        <div>
          <div id="brand-title" class="brand-title zh">写给秋然</div>
          <div id="brand-sub" class="brand-sub zh">秋日</div>
        </div>
        <div class="top-actions">
          <nav id="nav" class="nav">
            <button type="button" data-view="cover" class="active">封面</button>
            <button type="button" data-view="story">信</button>
            <button type="button" data-view="album">相册</button>
          </nav>
          <div class="lang">
            <button type="button" data-lang="zh" class="active">中文</button>
            <button type="button" data-lang="en">EN</button>
          </div>
          <button type="button" id="btn-music" class="btn-music is-on" aria-pressed="true" aria-label="暂停音乐" title="暂停音乐">
            <svg class="music-glyph" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path d="M10 18.5V7.2l9-1.7v11.3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
              <circle cx="8.2" cy="18.5" r="2.35" fill="currentColor" />
              <circle cx="17.2" cy="16.8" r="2.35" fill="currentColor" />
              <path class="music-slash" d="M4.2 5.2l15.6 14.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
            </svg>
          </button>
        </div>
      </header>

      <div id="motif-row" class="motif-row">
        <label class="motif m1" data-kind="tomato">
          <input type="radio" name="motif" />
          <span class="i" aria-hidden="true">🍅</span>
          <span class="spark" aria-hidden="true"></span>
          <span class="say">红着</span>
        </label>
        <label class="motif m2" data-kind="pepper">
          <input type="radio" name="motif" />
          <span class="i" aria-hidden="true">🫑</span>
          <span class="spark" aria-hidden="true"></span>
          <span class="say">青着</span>
        </label>
        <label class="motif m3" data-kind="eggplant">
          <input type="radio" name="motif" />
          <span class="i" aria-hidden="true">🍆</span>
          <span class="spark" aria-hidden="true"></span>
          <span class="say">静静的</span>
        </label>
        <label class="motif m4" data-kind="dog">
          <input type="radio" name="motif" />
          <span class="i" aria-hidden="true">🐕</span>
          <span class="spark" aria-hidden="true"></span>
          <span class="say">小狗</span>
        </label>
        <label class="motif m5" data-kind="maple">
          <input type="radio" name="motif" />
          <span class="i" aria-hidden="true">🍁</span>
          <span class="spark" aria-hidden="true"></span>
          <span class="say">秋</span>
        </label>
        <label class="motif m6" data-kind="flower">
          <input type="radio" name="motif" />
          <span class="i" aria-hidden="true">🌸</span>
          <span class="spark" aria-hidden="true"></span>
          <span class="say">花开</span>
        </label>
        <label class="motif m7" data-kind="mist">
          <input type="radio" name="motif" />
          <span class="i mist" aria-hidden="true"></span>
          <span class="spark" aria-hidden="true"></span>
          <span class="say">淡淡的</span>
        </label>
      </div>

      <section id="view-cover" class="view active" data-view="cover"></section>

      <section id="view-album" class="view" data-view="album">
        <div id="chapter-header" class="chapter"></div>
        <div id="book-stage" class="book-stage">
          <div class="album-book">
            <div class="album-spine" aria-hidden="true"></div>
            <div class="album-stack" aria-hidden="true"></div>
            <div class="album-block">
              <div id="book-page" class="page"></div>
              <div id="book-gl" class="book-gl" aria-hidden="true"></div>
            </div>
          </div>
        </div>
        <p id="swipe-hint" class="hint"></p>
      </section>
        <div class="controls">
          <button type="button" id="btn-prev" class="ctrl">上一页</button>
          <select id="page-jump" class="page-jump" aria-label="选页"></select>
          <button type="button" id="btn-next" class="ctrl">下一页</button>
        </div>
    </div>

    <div id="lightbox" class="lightbox" hidden>
      <button type="button" id="lightbox-close" class="lightbox-close" aria-label="Close">×</button>
      <img id="lightbox-img" alt="" />
      <p id="lightbox-caption"></p>
    </div>

    <audio id="bgm" src="audio/wind-poem.mp3" loop preload="auto"></audio>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
    <script src="js/config.js?v=17"></script>
    <script src="js/sha256.js"></script>
    <script src="data/album.js?v=17"></script>
    <script src="js/webgl-book.js?v=17"></script>
    <script src="js/app.js?v=17"></script>
  </body>
</html>
